schema @link(import : ["@key", "@requires", "@shareable", "@external"], url : "https://specs.apollo.dev/federation/v2.3"){
  query: Query
}

directive @external on OBJECT | FIELD_DEFINITION

directive @federation__composeDirective(name: String!) repeatable on SCHEMA

directive @federation__extends on OBJECT | INTERFACE

directive @federation__interfaceObject on OBJECT

directive @federation__override(from: String!) on FIELD_DEFINITION

directive @federation__provides(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @key(fields: federation__FieldSet!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

directive @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA

directive @requires(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @shareable repeatable on OBJECT | FIELD_DEFINITION

directive @tag(name: String!) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @tag_directive(add: String!, gateway: String!) repeatable on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

" ${inherit} "
interface ListingV2 {
  " ${inherit} "
  category: ListingCategory
  """
   The eligibleForPudo field indicates whether the listed item is eligible for PUDO (Pick Up/Drop Off) service.
  If the value is true, the listed item is eligible for pick-up or drop-off at a PUDO point.
  If the value is false, the listed item is not eligible for PUDO service.
  If the value is null, it means the service fails to return this field due to connection issue, etc. 
  """
  eligibleForPudo: Boolean
  " ${inherit} "
  fulfillmentTerms: FulfillmentTerms
  " ${inherit} "
  itemLocation: ItemLocation
  " ${inherit} "
  items: [Item!]!
  " ${inherit} "
  listingFormat: ListingFormat
  " ${inherit} "
  listingId: ID!
  " ${inherit} "
  marketplaceId: ID
  " ${inherit} "
  seller: User
}

union _Entity = Category | FulfillmentTerms | Item | SingleSkuListing | VariationListing

