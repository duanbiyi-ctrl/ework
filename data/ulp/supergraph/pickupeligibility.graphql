" ${inherit} "
type SingleSkuListing implements ListingV2 @key(fields : "listingId", resolvable : true) {
  " ${inherit} "
  category: ListingCategory @external
  """
   The eligibleForPudo field indicates whether the listed item is eligible for PUDO (Pick Up/Drop Off) service.
  If the value is true, the listed item is eligible for pick-up or drop-off at a PUDO point.
  If the value is false, the listed item is not eligible for PUDO service.
  If the value is null, it means the service fails to return this field due to connection issue, etc. 
  """
  eligibleForPudo: Boolean @requires(fields : "marketplaceId\nlistingFormat\nitemLocation { countryCode }\nseller { legacyUserId }\ncategory { primaryCategory { id } secondaryCategory { id } }\nfulfillmentTerms {\n  inStorePickupLogisticsPlanSupported\n  shippingTerms {\n    shippingOptions { costType shippingServices { rank shippingCost { original { amount currency } } shippingServiceCode } }\n    excludeShipToLocations\n    excludeShipToLocationsLastModifiedDateTime\n  }\n  managedShippingOptin\n  packageSpec { depth length width majorWeight minorWeight unitOfMeasure }\n}\nitems {\n  itemId\n  sellerPrice {\n    fixedPrice { original { amount currency } }\n    startingBidPrice { original { amount currency } }\n  }\n}") @tag_directive(add : "inaccessible", gateway : "publicapi") @tag_directive(add : "inaccessible", gateway : "sandbox")
  " ${inherit} "
  fulfillmentTerms: FulfillmentTerms @external
  " ${inherit} "
  itemLocation: ItemLocation @external
  " ${inherit} "
  items: [Item!]! @external
  " ${inherit} "
  listingFormat: ListingFormat @external
  " ${inherit} "
  listingId: ID!
  " ${inherit} "
  marketplaceId: ID @external
  " ${inherit} "
  seller: User @external
}

