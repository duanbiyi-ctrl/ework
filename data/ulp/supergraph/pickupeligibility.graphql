  eligibleForPudo: Boolean @requires(fields : "marketplaceId\nlistingFormat\nitemLocation { countryCode }\nseller { legacyUserId }\ncategory { primaryCategory { id } secondaryCategory { id } }\nfulfillmentTerms {\n  inStorePickupLogisticsPlanSupported\n  shippingTerms {\n    shippingOptions { costType shippingServices { rank shippingCost { original { amount currency } } shippingServiceCode } }\n    excludeShipToLocations\n    excludeShipToLocationsLastModifiedDateTime\n  }\n  managedShippingOptin\n  packageSpec { depth length width majorWeight minorWeight unitOfMeasure }\n}\nitems {\n  itemId\n  sellerPrice {\n    fixedPrice { original { amount currency } }\n    startingBidPrice { original { amount currency } }\n  }\n}\nminPrice { original { amount currency } }") @tag_directive(add : "inaccessible", gateway : "publicapi") @tag_directive(add : "inaccessible", gateway : "sandbox")
