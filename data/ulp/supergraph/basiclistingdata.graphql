"""
Check the access control list for the field in Mutations
Param: cid: String! - The client id that is allowed to access the field, using separator ',' for multiple values
"""
directive @auth(appIds: [String!]!) on ENUM_VALUE | INPUT_FIELD_DEFINITION

"""
Counter directive to define the counter name
Param: name: String! - The name of the counter
"""
directive @counter(name: String!) on ENUM_VALUE

directive @external on OBJECT | FIELD_DEFINITION

directive @federation__composeDirective(name: String!) repeatable on SCHEMA

directive @federation__extends on OBJECT | INTERFACE

directive @federation__override(from: String!) on FIELD_DEFINITION

directive @federation__provides(
  fields: federation__FieldSet!
) on FIELD_DEFINITION

directive @inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @interfaceObject on OBJECT

directive @key(
  fields: federation__FieldSet!
  resolvable: Boolean = true
) repeatable on OBJECT | INTERFACE

directive @link(
  as: String
  for: link__Purpose
  import: [link__Import]
  url: String!
) repeatable on SCHEMA

directive @requires(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @shareable repeatable on OBJECT | FIELD_DEFINITION

directive @tag(
  name: String!
) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Extend ListingV2 to add dealItem boolean field from this application.
@key indicates that ListingV2 can be uniquely identified via listingId
"""
interface ListingV2 @key(fields: "listingId", resolvable: false) {
  "listingId is key to ListingV2 and it needs to be included here"
  listingId: ID!
  "watch count of a listing"
  watchCount: Int
}

union _Entity =
  | CertifiedExpertInsight
  | Item
  | SingleSkuListing
  | VariationListing

"""
Contains the data field related with a specific certified expert insight.

The `certifiedExpertInsightClassification` and `certifiedExpertInsightAssetId` can be used as the input type for query `certifiedExpertInsight` to retrieve additional certified expert insight data
"""
type CertifiedExpertInsight
  @key(
    fields: "certifiedExpertInsightAssetId certifiedExpertInsightClassification"
    resolvable: true
  ) {
  "ID of the certified expert data defined by `officialdataprovider` application and used to retrieved certified expert insight data"
  certifiedExpertInsightAssetId: ID!
  """
  Classification of the certified expert asset data to be retrieved. This would be the String representation of the enum CertifiedExpertInsightClassification,

  This field will have a length of up to 20 characters, e.g. `PSA_TRADING_CARD`, `PSA_FUNKO`
  """
  certifiedExpertInsightClassification: String!
}

"""
Representing basic attributes required at the item level for listing the item.
An item will always be associated with a listing in order to be a purchasable entity.
"""
type Item
  @key(fields: "itemId", resolvable: true)
  @key(fields: "itemId", resolvable: true)
  @key(fields: "itemId", resolvable: true) {
  """
  Certified Expert Insight refers to information provided by recognized external authority or professional with validated expertise in a specific field or industry

  This entity provides data related to a specific certified expert insight and can also be used as input for the `certifiedExpertInsight` query.
  """
  certifiedExpertInsight: CertifiedExpertInsight
  "ID of an item."
  itemId: ID!
  "watch count of an item"
  watchCount: Int
}

type Mutation {
  "Use this mutation to add extended data to listings. Schema should be onboarded beforehand"
  basicListingData(
    listingDataInput: MutationBasicListingDataInput!
  ): MutationBasicListingDataOutput!
  "Use this mutation to decrease counter of an item"
  itemCounterDecrement(
    itemCounterDataInput: MutationItemCounterDataInput!
  ): MutationCounterDataOutput!
  "Use this mutation to increase counter of an item"
  itemCounterIncrement(
    itemCounterDataInput: MutationItemCounterDataInput!
  ): MutationCounterDataOutput!
  "Use this mutation to decrease counter of a listing"
  listingCounterDecrement(
    listingCounterDataInput: MutationListingCounterDataInput!
  ): MutationCounterDataOutput!
  "Use this mutation to increase counter of a listing"
  listingCounterIncrement(
    listingCounterDataInput: MutationListingCounterDataInput!
  ): MutationCounterDataOutput!
}

"Output of basicListingData mutation"
type MutationBasicListingDataOutput {
  "Results of each listing. Order is same as input order."
  result: Boolean!
}

"Output of increase/decrease counterData mutation."
type MutationCounterDataOutput {
  "Result of the mutation"
  result: Boolean!
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

"Entity representing a single SKU Listing."
type SingleSkuListing implements ListingV2
  @key(fields: "listingId", resolvable: true) {
  "Id of a Listing."
  listingId: ID!
  "watch count of a listing"
  watchCount: Int
}

"Entity representing a Multi SKU Listing."
type VariationListing implements ListingV2
  @key(fields: "listingId", resolvable: true) {
  "Id of a Listing."
  listingId: ID!
  "watch count of a listing"
  watchCount: Int
}

type _Service {
  sdl: String!
}

