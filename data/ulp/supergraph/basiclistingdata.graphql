enum CounterEnum {
  watchCount
    @auth(
      appIds: [
        "urn:ebay-marketplace-consumerid:b3044410-3483-4d37-8fe4-65cf2ead7dd8"
        "urn:ebay-marketplace-consumerid:5d35817c-4c4c-4fba-84fe-09a4ef8bb979"
      ]
    )
    @counter(name: "watchCount")
}

