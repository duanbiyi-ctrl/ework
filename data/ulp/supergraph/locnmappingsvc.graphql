"{inherit}"
interface ListingV2 {
  "{inherit}"
  seller: User
}

union _Entity = Item | ListingReference | SingleSkuListing | User | VariationListing

"{inherit}"
type Item @key(fields : "itemId", resolvable : true) {
  """
  All warehouse location details associated with this listing's item.
  This field exposes detailed inventory location data from the location mapping service,
  providing information about where inventory for this item is physically stored.
      
  The data is retrieved from the location mapping service endpoint:
  /v1/internal/puid/{puid}/listingid/{itemId}/all-locations
      
  Returns an object of warehouse locations where this item's inventory is available.
  If no inventory locations are found, this field returns an empty array.
  """
  inventoryLocations: ItemInventoryLocationDetails @exclude(gateways : ["publicapi"]) @requires(fields : "sku listing{listingId listing{seller{legacyUserId}}}")
  """
  The unique identifier for the listing. This field is defined in another subgraph
  and is required for fetching warehouse location data.
  """
  itemId: ID!
  """
  Reference to the listing associated with this item. This field is defined in another subgraph
  and provides access to listing-specific information.
  """
  listing: ListingReference! @external
  """
  The SKU (Stock Keeping Unit) for this item. This field is defined in another subgraph
  and is required for fetching warehouse location data.
  """
  sku: String @external
}

"""
ItemInventoryLocationDetails represents inventory location information for a specific item/SKU.
This type provides the top-level container for item-specific inventory location data, including
detailed warehouse location information for fulfillment operations.
"""
type ItemInventoryLocationDetails @exclude(gateways : ["publicapi"]) @shareable {
  """
  Detailed warehouse location information for this specific item/SKU.
  Returns array and contains specific location data including merchant location identifiers
  and other warehouse-related details for inventory management.
  """
  warehouseLocations: [ItemWarehouseLocationDetails!]!
}

"""
ItemWarehouseLocationDetails represents specific warehouse location information for individual items/SKUs.
This type contains the detailed location data for where a specific item's inventory
is physically stored, enabling location-based inventory management and fulfillment operations.
"""
type ItemWarehouseLocationDetails @exclude(gateways : ["publicapi"]) @shareable {
  """
  The unique identifier for the merchant location.
  This corresponds to a location defined in the seller's inventory management system
  and represents a specific warehouse, fulfillment center, or storage facility.
      
  Format: String identifier that uniquely identifies the merchant's location.
  This key is used to correlate inventory data with physical location information.
      
  Examples of expected values:
  - "WAREHOUSE_CA_001" - California warehouse facility
  - "FC_NY_MANHATTAN" - New York fulfillment center
  - "STORE_TX_DALLAS_001" - Dallas retail store location
  - "3PL_FEDEX_MEMPHIS" - Third-party logistics facility
  - "DC_EAST_COAST" - East coast distribution center
  - "VENDOR_DROPSHIP_01" - Vendor drop-ship location
  """
  merchantLocationKey: String!
}

"{inherit}"
type ListingReference @key(fields : "listingId", resolvable : false) {
  "{inherit}"
  listing: ListingV2 @external
  "{inherit}"
  listingId: ID!
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

"{inherit}"
type SingleSkuListing implements ListingV2 @key(fields : "listingId", resolvable : false) {
  "{inherit}"
  listingId: ID!
  "{inherit}"
  seller: User @external
}

"{inherit}"
type User @key(fields : "legacyUserId", resolvable : false) {
  "{inherit}"
  legacyUserId: String
}

"{inherit}"
type VariationListing implements ListingV2 @key(fields : "listingId", resolvable : false) {
  "{inherit}"
  listingId: ID!
  "{inherit}"
  seller: User @external
}

