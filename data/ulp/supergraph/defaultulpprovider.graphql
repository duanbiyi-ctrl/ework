schema @composeDirective(name : "@svlsField") @composeDirective(name : "@principleAuthorization") @composeDirective(name : "@compress") @composeDirective(name : "@fieldGroup") @composeDirective(name : "@ignoreForEventGeneration") @composeDirective(name : "@fallbackToSource") @composeDirective(name : "@exclude") @composeDirective(name : "@availableIn") @composeDirective(name : "@ulp_shareable") @composeDirective(name : "@ulp_inaccessible") @link(import : ["@key", "@shareable", "@extends", "@external", "@requires", "@override", "@composeDirective"], url : "https://specs.apollo.dev/federation/v2.3") @link(import : ["@svlsField", "@principleAuthorization", "@compress", "@ignoreForEventGeneration", "@fallbackToSource", "@fieldGroup", "@exclude", "@availableIn", "@ulp_shareable", "@ulp_inaccessible"], url : "https://ulppecs.dev/directives/v1.0"){
  query: Query
