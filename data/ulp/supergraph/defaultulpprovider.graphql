"Some fields/types are only available in certain environments."
directive @availableIn(env: String!) repeatable on SCALAR | OBJECT | FIELD_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @composeDirective(name: String!) repeatable on SCHEMA

"""
Some data are huge. We can optimize our storage to compress/decompress inline.
Examples:
itemCompatibilities: [ItemCompatibility] @compress
"""
directive @compress on FIELD_DEFINITION

"""
Some definitions should not be passed through ULS to the target gateway.
So you can specify which gateways this should be exposed. If no argument is given, it will
be excluded for all gateways.
Example to exclude from some gateways:
type DefaultULPProviderOutput @exclude(gateways: ["public", "publicapi"])

Example to exclude from all gateways:
type DefaultULPProviderOutput @exclude

This is a dummy type for illustration purpose only.
"""
directive @exclude(gateways: [String!]) on OBJECT | FIELD_DEFINITION | INTERFACE | UNION | ENUM

directive @extends on OBJECT | INTERFACE

directive @external on OBJECT | FIELD_DEFINITION

"""
Directive to decide the fields for fallback retrieving.
For example, if the record modification date is less than the start date, then this record should be retrieved from the gateway.
Note: The time zone of the startDate and endDate is UTC.
Examples:
dummyFiled: String @fallbackToSource(startDate: "2025-08-01T00:00:00Z", endDate: "2025-08-31T23:59:59Z")
"""
directive @fallbackToSource(endDate: DateTime!, startDate: DateTime!) on FIELD_DEFINITION

directive @federation__interfaceObject on OBJECT

directive @federation__provides(fields: federation__FieldSet!) on FIELD_DEFINITION

"""
Some fields belong to different field group. E.g. some fields are on-demand field, which means they are calculated
asynchronously and notify ULS when they are done. All fields in a field group are queried together by ULS through ULP
gateway.
Examples:
dummyField: String @fieldGroup(name: "dummy_ondemand")
"""
directive @fieldGroup(name: String!) on FIELD_DEFINITION

"""
Directive to ignore the fields for event generation.
For example, if a field is not required for event generation, it can be marked with this directive and the event name
Examples:
watchCount Int @ignoreForEventGeneration(eventName: "ULP.LISTING.UPDATE")
"""
directive @ignoreForEventGeneration(eventName: String!) on FIELD_DEFINITION

directive @inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @key(fields: federation__FieldSet!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

directive @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA

directive @override(from: String!) on FIELD_DEFINITION

"""
Checks security context principle (user) with the given field value. Field defined here should be relative to ListingV2.
For example, for seller listing, it will be @principleAuthorization(field: "seller {legacyUserId}").
If match return the field value else return null and error
"""
directive @principleAuthorization(field: String!) on FIELD_DEFINITION

directive @requires(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @shareable repeatable on OBJECT | FIELD_DEFINITION

"Directive to tag the original field name used SVLS for a given field in schema."
directive @svlsField(description: String, fieldName: String!) repeatable on FIELD_DEFINITION

directive @tag(name: String!) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Pass through directive corresponding to @inaccessible. If you mark your type/field with @ulp_inaccessible, in the generated
ULS schema, they will be marked as @inaccessible
"""
directive @ulp_inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
Pass through directive corresponding to @shareable. If you mark your type/field with @ulp_shareable, in the generated
ULS schema, they will be marked as @shareable
"""
directive @ulp_shareable on OBJECT | FIELD_DEFINITION

union _Entity = DefaultULPProviderOutput

" Default ULP Provider output. This is for illustration purpose only so exclude it from known gateways "
type DefaultULPProviderOutput @exclude(gateways : ["public", "publicapi"]) @key(fields : "id", resolvable : true) {
  "Description"
  description: String @compress @ignoreForEventGeneration(eventName : "ULP.LISTING.UPDATE") @principleAuthorization(field : "seller { legacyUserId } ")
  "A test field only exists in feature environment"
  featureTestField: String @availableIn(env : "feature") @principleAuthorization(field : "seller { legacyUserId } ")
  "default ulp provider output id"
  id: ID!
  """
  alternative group field example. It also has @exclude directive. As the parent type is already excluded from public
  and publicapi gateways, this @exclude doesn't have real effect as even without @exclude it will be also excluded
  from these gateways. This is just to show how to use @exclude directive on field level.
  """
  otherGroupField: String @exclude(gateways : ["public"]) @fieldGroup(name : "example_field_group") @ulp_inaccessible
  "A test field only exists in staging environment"
  prodAndPreprodTestField: String @availableIn(env : "production") @availableIn(env : "preproduction") @principleAuthorization(field : "seller { legacyUserId } ")
  "A test field only exists in staging environment"
  stagingTestField: String @availableIn(env : "staging") @principleAuthorization(field : "seller { legacyUserId } ")
}

"Contains the map of ebay generated URL and self hosted picture URL for a picture of the item. The URL can be from the eBay Picture Services (images previously uploaded) or from a server outside of eBay (self-hosted)."
type Photo @shareable @ulp_shareable {
  "Self hosted picture URL provided by the seller."
  ebayPictureUrl: String
  "ebay generated URL for the self hosted picture URL provided by seller."
  externalPictureUrl: String
  "Seller provided order of the picture in which the image should be displayed"
  order: Int
}

" Query "
type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
  " dummy query. @exclude to show how to exclude from some gateways"
  defaultUlpProvider: DefaultULPProviderOutput @exclude(gateways : ["public", "publicapi"])
}

"""
A type only available in staging env.
Also add @exclude directive so it's not leaked into public or publicapi gateway.
"""
type TypeForStagingOnlyExample @availableIn(env : "staging") @exclude(gateways : ["public", "publicapi"]) {
  "dummy ID field"
  id: ID!
}

type _Service {
  sdl: String!
}

enum ErrorDetail {
  """
  The deadline expired before the operation could complete.
  
  For operations that change the state of the system, this error
  may be returned even if the operation has completed successfully.
  For example, a successful response from a server could have been
  delayed long enough for the deadline to expire.
  
  HTTP Mapping: 504 Gateway Timeout
  Error Type: UNAVAILABLE
  """
  DEADLINE_EXCEEDED
  """
  The server detected that the client is exhibiting a behavior that
  might be generating excessive load.
  
  HTTP Mapping: 429 Too Many Requests or 420 Enhance Your Calm
  Error Type: UNAVAILABLE
  """
  ENHANCE_YOUR_CALM
  """
  The requested field is not found in the schema.
  
  This differs from `NOT_FOUND` in that `NOT_FOUND` should be used when a
  query is valid, but is unable to return a result (if, for example, a
  specific video id doesn't exist). `FIELD_NOT_FOUND` is intended to be
  returned by the server to signify that the requested field is not known to exist.
  This may be returned in lieu of failing the entire query.
  See also `PERMISSION_DENIED` for cases where the
  requested field is invalid only for the given user or class of users.
  
  HTTP Mapping: 404 Not Found
  Error Type: BAD_REQUEST
  """
  FIELD_NOT_FOUND
  """
  The client specified an invalid argument.
  
  Note that this differs from `FAILED_PRECONDITION`.
  `INVALID_ARGUMENT` indicates arguments that are problematic
  regardless of the state of the system (e.g., a malformed file name).
  
  HTTP Mapping: 400 Bad Request
  Error Type: BAD_REQUEST
  """
  INVALID_ARGUMENT
  """
  The provided cursor is not valid.
  
  The most common usage for this error is when a client is paginating
  through a list that uses stateful cursors. In that case, the provided
  cursor may be expired.
  
  HTTP Mapping: 404 Not Found
  Error Type: NOT_FOUND
  """
  INVALID_CURSOR
  """
  Unable to perform operation because a required resource is missing.
  
  Example: Client is attempting to refresh a list, but the specified
  list is expired. This requires an action by the client to get a new list.
  
  If the user is simply trying GET a resource that is not found,
  use the NOT_FOUND error type. FAILED_PRECONDITION.MISSING_RESOURCE
  is to be used particularly when the user is performing an operation
  that requires a particular resource to exist.
  
  HTTP Mapping: 400 Bad Request or 500 Internal Server Error
  Error Type: FAILED_PRECONDITION
  """
  MISSING_RESOURCE
  """
  Service Error.
  
  There is a problem with an upstream service.
  
  This may be returned if a gateway receives an unknown error from a service
  or if a service is unreachable.
  If a request times out which waiting on a response from a service,
  `DEADLINE_EXCEEDED` may be returned instead.
  If a service returns a more specific error Type, the specific error Type may
  be returned instead.
  
  HTTP Mapping: 502 Bad Gateway
  Error Type: UNAVAILABLE
  """
  SERVICE_ERROR
  """
  Request failed due to network errors.
  
  HTTP Mapping: 503 Unavailable
  Error Type: UNAVAILABLE
  """
  TCP_FAILURE
  """
  Request throttled based on server concurrency limits.
  
  HTTP Mapping: 503 Unavailable
  Error Type: UNAVAILABLE
  """
  THROTTLED_CONCURRENCY
  """
  Request throttled based on server CPU limits
  
  HTTP Mapping: 503 Unavailable.
  Error Type: UNAVAILABLE
  """
  THROTTLED_CPU
  """
  The operation is not implemented or is not currently supported/enabled.
  
  HTTP Mapping: 501 Not Implemented
  Error Type: BAD_REQUEST
  """
  UNIMPLEMENTED
  """
  Unknown error.
  
  This error should only be returned when no other error detail applies.
  If a client sees an unknown errorDetail, it will be interpreted as UNKNOWN.
  
  HTTP Mapping: 500 Internal Server Error
  """
  UNKNOWN
}

enum ErrorType {
  """
  Bad Request.
  
  There is a problem with the request.
  Retrying the same request is not likely to succeed.
  An example would be a query or argument that cannot be deserialized.
  
  HTTP Mapping: 400 Bad Request
  """
  BAD_REQUEST
  """
  The operation was rejected because the system is not in a state
  required for the operation's execution.  For example, the directory
  to be deleted is non-empty, an rmdir operation is applied to
  a non-directory, etc.
  
  Service implementers can use the following guidelines to decide
  between `FAILED_PRECONDITION` and `UNAVAILABLE`:
  
  - Use `UNAVAILABLE` if the client can retry just the failing call.
  - Use `FAILED_PRECONDITION` if the client should not retry until
  the system state has been explicitly fixed.  E.g., if an "rmdir"
       fails because the directory is non-empty, `FAILED_PRECONDITION`
  should be returned since the client should not retry unless
  the files are deleted from the directory.
  
  HTTP Mapping: 400 Bad Request or 500 Internal Server Error
  """
  FAILED_PRECONDITION
  """
  Internal error.
  
  An unexpected internal error was encountered. This means that some
  invariants expected by the underlying system have been broken.
  This error code is reserved for serious errors.
  
  HTTP Mapping: 500 Internal Server Error
  """
  INTERNAL
  """
  The requested entity was not found.
  
  This could apply to a resource that has never existed (e.g. bad resource id),
  or a resource that no longer exists (e.g. cache expired.)
  
  Note to server developers: if a request is denied for an entire class
  of users, such as gradual feature rollout or undocumented allowlist,
  `NOT_FOUND` may be used. If a request is denied for some users within
  a class of users, such as user-based access control, `PERMISSION_DENIED`
  must be used.
  
  HTTP Mapping: 404 Not Found
  """
  NOT_FOUND
  """
  The caller does not have permission to execute the specified
  operation.
  
  `PERMISSION_DENIED` must not be used for rejections
  caused by exhausting some resource or quota.
  `PERMISSION_DENIED` must not be used if the caller
  cannot be identified (use `UNAUTHENTICATED`
  instead for those errors).
  
  This error Type does not imply the
  request is valid or the requested entity exists or satisfies
  other pre-conditions.
  
  HTTP Mapping: 403 Forbidden
  """
  PERMISSION_DENIED
  """
  The request does not have valid authentication credentials.
  
  This is intended to be returned only for routes that require
  authentication.
  
  HTTP Mapping: 401 Unauthorized
  """
  UNAUTHENTICATED
  """
  Currently Unavailable.
  
  The service is currently unavailable.  This is most likely a
  transient condition, which can be corrected by retrying with
  a backoff.
  
  HTTP Mapping: 503 Unavailable
  """
  UNAVAILABLE
  """
  Unknown error.
  
  For example, this error may be returned when
  an error code received from another address space belongs to
  an error space that is not known in this address space.  Also
  errors raised by APIs that do not return enough error information
  may be converted to this error.
  
  If a client sees an unknown errorType, it will be interpreted as UNKNOWN.
  Unknown errors MUST NOT trigger any special behavior. These MAY be treated
  by an implementation as being equivalent to INTERNAL.
  
  When possible, a more specific error should be provided.
  
  HTTP Mapping: 520 Unknown Error
  """
  UNKNOWN
}

