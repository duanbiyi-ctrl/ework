"""
Result of a bulk meta-description mutation (upsert or delete). Internal only. Best-effort:
`results` carries one outcome per requested listing in request order, and `success` is true
only when every outcome succeeded. Retry just the failed listings (writes are idempotent).
"""
type BulkListingMetaDescriptionResult @tag(name : "internal") {
  "One outcome per requested listing, in request order."
  results: [ListingMetaDescriptionOutcome!]!
  "True when every listing in the request succeeded."
  success: Boolean!
}

