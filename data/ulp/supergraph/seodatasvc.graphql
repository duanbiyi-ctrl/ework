"""
 Declared locally, not @link-imported from the Apollo Federation spec — so Apollo's built-in @tag
 composition rules (e.g. "cannot apply @tag to an @external field") don't apply to it here.
"""
directive @tag(name: String!) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

"""
 Dynamically adds another directive (inaccessible/requires/external) to an element only when
 composing for the named gateway; every other gateway's composition is untouched. Declared locally,
 not @link-imported, for the same reason as @tag above.
"""
directive @tag_directive(add: String!, gateway: String!) repeatable on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

