"One listing's outcome within a bulk meta-description mutation. Internal only."
type ListingMetaDescriptionOutcome @tag(name : "internal") {
  "Why this listing did not fully succeed; null when success is true."
  failureReason: MetaDescriptionFailureReason
  "The listing ID this outcome refers to."
  listingId: ID!
  "True when the listing's write persisted."
  success: Boolean!
}

"""
The mutation root must remain present in every composed gateway variant, even
when that variant excludes all real mutation fields by `@tag`. Keep this type
untagged and retain `workaroundNoOp` as its composition-only sentinel. Tag each
real mutation field for the gateway variants that should expose it; never tag
the `Mutation` type itself.
"""
type Mutation {
  """
  Removes many listings' meta descriptions in one request. Internal only. Same best-effort
  batching contract as the bulk upsert; per-listing idempotent (absent = success). Retry only
  the failed listings. IDs are unique; at most the configured bulk maximum (default 1000) per request.
  """
  deleteListingMetaDescriptions(input: DeleteListingMetaDescriptionsInput!): BulkListingMetaDescriptionResult! @tag(name : "internal")
  """
  Persists many listings' meta descriptions in one request — the loader's primary path.
  Internal only. Best-effort, not atomic: every listing is attempted and the result carries
  one outcome per listing (`NOT_PERSISTED` when a write did not persist). Retry only the failed
  listings (idempotent). Each description is non-blank and within the service's configured maximum
  length (default 500); IDs are unique; at most the configured bulk maximum (default 1000) per request.
  """
  upsertListingMetaDescriptions(input: UpsertListingMetaDescriptionsInput!): BulkListingMetaDescriptionResult! @tag(name : "internal")
  "{inherit}"
  workaroundNoOp: Boolean @inaccessible @shareable
}

