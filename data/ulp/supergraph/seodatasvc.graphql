"""
Association between a taxonomy aspect name/value pair and a Wikidata QID.
Page-context neutral: reusable by listing, browse, product, or any page context
that exposes taxonomy aspects. The parent object supplies the page context.
"""
type WikidataTaxonomyAspectValueAssociation @tag(name : "public") {
  """
  Taxonomy aspect name associated with the Wikidata QID, e.g. `model`, `brand`,
  or `color`.
  """
  taxonomyAspectName: String!
  """
  Taxonomy aspect value associated with the Wikidata QID. For example, when
  `taxonomyAspectName` is `model`, this may be `Apple iPhone 15 Pro Max`.
  """
  taxonomyAspectValue: String!
  "Raw count of supported listings observed with this aspect value (not a normalized score); sort key, descending."
  taxonomyAspectValueListingCount: Int!
  """
  Wikidata QID associated with the taxonomy aspect value.
  
  A QID (Q number) is the Wikidata identifier, formatted as `Q` followed by digits,
  e.g. `Q125178718`. Typed `String`, not `ID`: it identifies a Wikidata item, not a
  node resolvable in this graph.
  """
  wikidataQid: String!
}

