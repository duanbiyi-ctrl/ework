"""
Input parameters for determining a item's Country of Origin (COO).
This type contains all the necessary item information needed to accurately determine COO, supporting:
- Prelisting flows: When sellers are creating new listings and need to declare the product's origin
- Postlisting flows: When existing listings need COO validation or enrichment
Required fields include category and marketplaceId, while other fields provide additional context for more accurate determination.
"""
input ItemCountryOfOriginInput @tag(name : "public") {
  """
  A flexible key-value pair structure used throughout the API for representing attributes that have a name and
  multiple associated values. This versatile input type is used in many contexts, such as product aspects,
  item specifics, and product identifiers, where a single attribute can have multiple valid values.
  """
  aspects: [NameValuesPairInput]
  "Leaf category ID of the item listed in current listing."
  category: ID!
  "Indicates the geographical location of the item.  ISO alpha 2 code"
  itemLocation: String
  "listingId is key to ListingV2 and it needs to be included here"
  listingId: ID
  "Marketplace where the item is listed. e.g., EBAY-US, EBAY-MOTORS-US, EBAY-GB etc."
  marketplaceId: ID!
  "Mode for RegulatorySvc to determine country of origin"
  mode: ItemCountryOfOriginFetchMode
  """
  This type is used to provide common product details for the listing, including product aspects,
  title, description, condition, images, and more.
  """
  sellerProduct: SellerProductCountryOfOriginInput
}

"{inherit}"
input NameValuesPairInput @tag(name : "public") {
  "{inherit}"
  name: String
  "{inherit}"
  values: [String!]
}

"""
Input type containing seller-provided item attributes used for Country of Origin (COO) determination.
This includes product identifiers (epid, global identifiers like UPC/GTIN/MPN) and descriptive information
(title) that help accurately determine where the item was manufactured or produced. These attributes
are analyzed alongside other inputs like category and aspects to provide a comprehensive item profile
for COO determination.
"""
input SellerProductCountryOfOriginInput @tag(name : "public") {
  "eBay's short global reference ID for a catalog product. On the eBay Web site, this is known as the 'ePID' or 'Product ID'."
  epid: ID
  "Global identifiers for the product like UPC, GTIN, MPN, etc"
  globalIdentifiers: [NameValuesPairInput!]
  "Name of the item as it appears in the listing or search results. Max length: 80."
  title: String
}