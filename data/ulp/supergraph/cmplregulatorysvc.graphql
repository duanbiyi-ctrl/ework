"""
Root query type for the Country of Origin (COO) GraphQL API.
This type provides access to the COO determination functionality, allowing clients to
retrieve standardized country of origin information for items based on their attributes.
The API supports both direct queries and entity resolution through federation.
"""
type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
  """
  Determine the country of origin for a item based on its attributes.
  This query can be used when a listing ID is not available.
  """
  itemCountryOfOrigin(input: ItemCountryOfOriginInput!): ItemCountryOfOriginOutput @tag(name : "public")
}

