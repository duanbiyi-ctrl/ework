"""
Operational modes for Country of Origin (COO) determination.
This enum controls how the Regulatory Service retrieves COO information:
- CACHE_ONLY: Fast retrieval from pre-determined values stored in the database
- VENDOR_ONLY: Real-time determination using external vendor APIs (e.g., Zonos)
- CACHE_OR_VENDOR: Optimized approach that checks cache first, then falls back to vendor if needed
The selected mode affects response time, accuracy, and system resource utilization.
"""
enum ItemCountryOfOriginFetchMode @tag(name : "public") {
  "Use only cached data"
  CACHE_ONLY
  "Use both cached data and vendor API (default)"
  CACHE_OR_VENDOR
  "Use only vendor API"
  VENDOR_ONLY
}

