"""
Country of Origin (COO) information that is attached to a listing.
This type contains the standardized COO data determined by the regulatory service,
including both the country code and a confidence score. When resolved as part of a
ListingV2 entity, this data represents the officially determined origin of the item
that has been validated and can be used for compliance and regulatory purposes.
"""
type ItemCountryOfOrigin @exclude(gateways : ["publicapi", "sandbox"]) @tag(name : "ulp") {
  "Confidence score for the country of origin determination (0.0 to 1.0)"
  confidenceScore: Float
  """
  Country of origin - the country where the product was actually made, manufactured, or produced.
  It is an ISO 3166-1 alpha-2 country code that compliance should map to the country name.
  Currently the provider for the country of origin ISO codes is Zonos APIs.
  """
  countryOfOrigin: CountryCode
}

"""
Response type containing the determined Country of Origin (COO) information for a item.
This type is returned by the countryOfOrigin query and provides standardized COO data that can be used in both:
- Prelisting flows: When sellers are creating new listings and need to declare the items's origin
- Postlisting flows: When existing listings need COO validation or enrichment
The data includes both the country code and a confidence score indicating the reliability of the determination.
"""
type ItemCountryOfOriginOutput @tag(name : "public") {
  "Confidence score for the country of origin determination (0.0 to 1.0)"
  confidenceScore: Float
  """
  Country of origin - the country where the item was actually made, manufactured, or produced.
  It is an ISO 3166-1 alpha-2 country code that compliance should map to the country name.
  Currently the provider for the country of origin ISO codes is Zonos APIs.
  """
  countryOfOrigin: CountryCode
}

