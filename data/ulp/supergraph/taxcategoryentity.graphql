  - **Type**: ItemTaxCategoryDetails
  - **Directive**: @requires - Indicates that listing category and marketplace data are required for tax category prediction.
  - **Note**: Access this field directly on the Item type. Tax category information is derived from item
  specifications and listing metadata (category and marketplace). Additional context such as user location
  may be read from request headers by the subgraph implementation if needed for prediction accuracy.
  """
  itemTaxCategoryDetails: ItemTaxCategoryDetails @requires(fields : "listing {\n    listing {\n        category {\n            primaryCategory {\n                id\n            }\n        }\n        marketplace\n    }\n}")
  "{inherit}"
  listing: ListingReference! @external
}

"""
The `ItemTaxCategoryDetails` type delivers tax category information for items within the inventory service.
It predicts the tax category based on item specifications, providing essential data for tax rate determination.
"""
type ItemTaxCategoryDetails {
  """
  - **Description**: Represents the unique identifier for the item for which tax category details are provided.
  It links the tax category information directly to the specific item.
  - **Type**: ID
  - **Requirement**: Mandatory, ensuring that tax category details are always associated with a specific item.
  """
  itemId: ID!
  """
  - **Description**: This field denotes the identifier for the predicted tax category.
  It helps in uniquely identifying the specific tax category applicable to the item.
  The value is resolved using the following fallback chain:
    1. Primary prediction from the tax category prediction service.
    2. If no prediction is found, a lookup is performed against TaxLite to retrieve the category ID.
    3. If TaxLite also returns no result, the ID corresponding to the default category "TPP/Goods" is returned.
  - **Type**: ID
  - **Nullability**: This field is always present. Falls back to TaxLite lookup, then defaults to the "TPP/Goods" category ID.
  - **Requirement**: All items will have a tax category ID.
  - **Example Values**: "265", "59", "100100"
  """
  taxCategoryId: ID!
  """
  - **Description**: Provides the human-readable name of the predicted tax category based on item specifications.
  This is a descriptive label that identifies the specific tax category (e.g., "Books", "Electronics", "Clothing").
  The value is resolved using the following fallback chain:
    1. Primary prediction from the tax category prediction service.
    2. If no prediction is found, a lookup is performed against TaxLite to retrieve the category.
    3. If TaxLite also returns no result, the default value "TPP/Goods" is returned.
  - **Type**: String
  - **Nullability**: This field is always present. Falls back to TaxLite lookup, then defaults to "TPP/Goods".
  - **Requirement**: All items will have a tax category name.
  - **Example Values**: "Books", "Electronics", "Digital Downloads", "Apparel", "TPP/Goods"
  """
  taxCategoryName: String!
  """
  - **Description**: Specifies the classification type of the tax category. This field indicates the broad category
  classification for tax purposes, distinguishing between digital goods (DDG) and regular/physical goods (REGULAR).
  This classification is used by CTMS and other systems to apply appropriate tax rules and rates.
  - **Type**: String
  - **Allowed Values**:
    - DDG: Digital goods requiring special tax treatment (e.g., software, e-books, digital media)
    - REGULAR: Standard physical goods and services
  - **Nullability**: This field is always present. Falls back to TaxLite lookup, then defaults to REGULAR.
  - **Requirement**: All items will have a tax category type.
  - **Usage**: This field is NOT used as a type discriminator for GraphQL interface/union types. It serves as a
  business classification to help clients determine the appropriate tax treatment for the item.
  - **Difference from taxCategoryName**: While taxCategoryName provides the specific category (e.g., "E-Books"),
  taxCategoryType provides the broad classification (e.g., DDG for digital goods).
  """
  taxCategoryType: String!
}

