"${inherit}"
interface ListingV2 {
  "${inherit}"
  listingId: ID!
  "Listing visibility evaluation result for the current site, including all 100+ Global Buying Hub sites."
  visibility: ListingVisibility! @exclude(gateways : ["publicapi"]) @tag(name : "public")
  """
  Listing visibility evaluation result for all sites.
  The summary will be available for any item eventually but may be `null` initially as its calculation may take a few seconds.
  """
  visibilitySummary: ListingVisibilitySummary @exclude(gateways : ["publicapi"]) @tag(name : "ulp")
}

union _Entity = SingleSkuListing | VariationListing

"This container describes the outcome of visibility rules evaluation for the current site (from user's context)."
type ListingVisibility @exclude(gateways : ["publicapi"]) @tag(name : "public") {
  """
  This flag indicates if a listing should not be surfaced in the native app. What exactly "not surfaced" means is up to a particular view implementation,
  some examples include: prevent it from being displayed in the search results, hide "Buy it now" button on VIP, display an error message when checkout is
  attempted. Right now, this flag is set for the listings believed to be digitally delivered goods (DDG), but this may change in the future.
  If the flag is `true`it should be blocked for purchase on native, if false there are no native specific restrictions.
  """
  hasNativeBlock: Boolean!
}

"""
This container describes the outcome of visibility rules evaluation for a listing for ALL sites, including Global Buying Hub sites (100+ in total). The results of this
evaluation is used, as an example, to determine if an item can show up in Search Results Page / View Item Page / Merchant feed and some other pages.
"""
type ListingVisibilitySummary @exclude(gateways : ["publicapi"]) @tag(name : "ulp") {
  """
  This is the list of site ids where "Default" listing visibility is on. "Default" visibility is used by Search backend when it decides if a listing may appear
  in search results in case if the size of the "recall set" - i.e. the number of all listings matching the search criteria - is big enough.
  
  NOTE: if a particular site is not on this list, the listing may still appear in the search results on that site, but in general, this is an
  edge case flow (called "Null & Low Recovery") which is ONLY triggered when size of the recall set falls below the threshold configured on the Search backend
  side. That recovery flow uses another kind of visibility which Search groks from the `packedVisibilityString` field above.
  """
  defaultVisibleSites: [Int!]!
  """
  This is the list of site ids where a listing has an explicit (i.e. assigned to this very listing) visibility block(s) set by subsystems like GCX / eBay Live
  backend / VeRO / regulatory compliance, etc. Note: even if a listing is not explicitly blocked on a site, it doesn't mean it will necessarily appear on the
  `defaultVisibleSites` list. If a listing is explicitly blocked on a site, then it won't be included in `defaultVisibleSites` list.
  """
  explicitlySuppressedSites: [Int!]!
  """
  This is an internal representation of the visibility evaluation result. This string is a comma-separated list of '<site-id>=<bit mask>' pairs, where the bit
  mask encodes the visibility evaluation result for a particular site. For example, `0=133,77=128,...`, all site ids are included there.
  
  NOTE: If you're not a Search / Reco backend, you should NOT use this field.
  """
  packedVisibilityString: String!
}

