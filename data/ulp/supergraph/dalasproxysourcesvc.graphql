"""
Dalas evaluation process is treated as two phases.
The first phase computes listing derived attributes through plugin orchestration.
The second phase creates the final unified container and Dalas manifestId for persistence in ULP's storage.
This type provides the consolidated result generated by the entire evaluation process.
"""
type DalasEvaluation @key(fields : "listingId", resolvable : true) {
  """
  This field stores the attributes produced during the first phase of the evaluation for the listing.
  It is marked as @inaccessible because it is intended exclusively for Dalas' plugins.
  It is not exposed to, or used by, any other client applications or external consumers.
  """
  dalasSource: DalasSourceEvaluation! @inaccessible
  "The unique identifier of a listing defined in ListingV2."
  listingId: ID!
}

"""
"
During the Dalas evaluation process, plugins are executed to compute derived attributes for a listing.
This type represents entity containers which are produced from the first phase of the evaluation process for a
listing and is intended for internal use by Dalas plugins only.
"""
type DalasSourceEvaluation {
  "This is a unique identifier that introduces sequential processing of evaluations to assist in garbage collection for Dalas and to help synchronize its data storage with ULP, no other service or client can use this."
  baseGuid: String @inaccessible
  "A Base64 encoded string that represents a container of attributes computed from the most recent completed evaluation run, if available. Each plugin has their own logic to make a decision whether to recompute or use this container from the previous evaluation. This field is null for first-time evaluations. The size of this string will be between 9-20KB depending on the listing."
  dalasEntityContainerPreExisting: String
  "A Base64 encoded string of the first Dalas evaluation outcome that represents a container of attributes computed by the plugins in bytes. Dalas plugins are meant to consume this field to expose their computed attribute through GraphQL. The size of this string will be between 9-20KB depending on the listing."
  dalasEntityContainerSource: String!
}

