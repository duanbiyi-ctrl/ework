"Status of the discount."
enum DiscountStatusInput @tag(name : "public") {
  "An active status on discount indicates the discount is live."
  ACTIVE
  "Indicates the discount has been deleted."
  DELETED
  "Indicates the discount is a draft. To schedule or make the discount active submit the full details of discount."
  DRAFT
  "Indicates the discount is ended."
  ENDED
  "Indicates the discount is being processed."
  PROCESSING
  "A scheduled status on discount indicates the discount start date and end date are in future(greater than current date). Discount is not live yet."
  SCHEDULED
  "A suspended status on discount indicates the discount is currently put on hold (discount is not live anymore)."
  SUSPENDED
}

