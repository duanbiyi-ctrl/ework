"Type of the listing markdown discount status"
enum ListingMarkdownStatusType @tag(name : "public") {
  "Status type where listing is eligible for markdown sale"
  ELIGIBLE
  "Status type where listing price marking failed"
  FAILED
  "Status type where listing is in the process of being marked up or down"
  PENDING
  "Status type where listing is skipped from markdown sale. The listing was not marked down or up."
  SKIPPED
  "Status type where listing price marking is successfully processed"
  SUCCESS
}

"${inherit}"
enum ListingStatus @tag(name : "public") {
  "${inherit}"
  ACTIVE
  "${inherit}"
  ENDED
  "${inherit}"
  UNKNOWN
}

"Filter listings returned by their status in the markdown discount"
enum MarkdownDiscountListingStatusFilter @tag(name : "public") {
  "Filter by listings that are in the process of being marked down"
  MARKDOWN_PENDING
  "Filter by listings that are successfully and actively marked down in the Markdown discount"
  MARKDOWN_SUCCESS
  """
  Filter by listings that are marked for adding to the Markdown discount.
  These listings are scheduled to be processed to go on sale and will be marked down as part of the discount.
  """
  MARKED_FOR_ADDITION
  """
  Filter by listings that are marked for removal from the Markdown discount.
  These listings are scheduled to be processed to go off sale and will be removed from sale.
  """
  MARKED_FOR_REMOVAL
  "Filter by listings that are in the process of being marked up"
  MARKUP_PENDING
}

