"""
[DEPRECATED] Use ListingV2.listingCompatibilities.

Compatibility information for an item.
Example: If the item is a brake pad, this field will contain a list of vehicles this brake pad fits into.
Vehicle information is represented by tokens. Eg. Year, Make, Model, Trim, Engine which are all key-value pairs.
Each of these token combinations is represented by a single notionalProfile.
If this brake pad fits 10 cars, then there will be 10 notionalProfileIds listed in this field where each
notionalProfileId represents a unique combination of Year+Make+Model+Trim+Engine.

The field itemCompatibility contains fitment data supplied by the seller. The field itemCompatibilityV2 contains
compatibility data such as fitment data supplied by seller, enhanced by a domain specific internal catalog, or from eBay product catalog.
"""
