  or replaced by eBay product catalog.
  These fitments are indexed by search, shown on view item page, and used for compatibility matches in guaranteed fit feature.
  """
  computedCompatibilitiesByMarketplace: [ItemCompatibilitiesByMarketplace!]!
  " item identifier"
  itemId: ID! @inaccessible
}

