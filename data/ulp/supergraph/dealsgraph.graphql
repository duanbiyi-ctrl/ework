"${inherit}"
interface ListingV2 {
  """
   Contains information if the listing is a Daily Deal or not and other details. If null, the listing is not a Deal.
  But all listings are eligible to become Deals. 
  """
  dealDetails: ListingDailyDealDetails @tag_directive(add : "inaccessible", gateway : "publicapi") @tag_directive(add : "inaccessible", gateway : "sandbox")
  "${inherit}"
  listingId: ID!
}

union _Entity = SingleSkuListing | VariationListing

"""
A daily deal is a special, time-limited promotional offer on eBay that features select items at significantly reduced prices,
with sometimes a restricted purchase quantity and set start and end dates.
For now, only a subset of the deals attributes are exposed on FGQL.
Other attributes like agreed price and currency, are available on the RPP_DEAL_ITEM table.
It's possible to define new Deals using the SpotLight app. You can define a new set of Deals
based on a list of listing IDs or a search query.
"""
type ListingDailyDealDetails @tag_directive(add : "inaccessible", gateway : "publicapi") @tag_directive(add : "inaccessible", gateway : "sandbox") {
  """
  The quantity available for the deal listing per buyer to buy. It ranges from 1 to 100.
  If 0, it means there's no quantity restriction per buyer.
  Will be null if the listing is not part of a deal and no qunatity restriction.
  """
  dailyDealsItemQuantity: Int
  " The deals end date for a deal. Will be null if the listing is not part of a deal."
  dealEndDateTime: DateTime
  """
   The deals start date
  Will be null it the listing is not part of a deal.
  """
  dealStartDateTime: DateTime
  " Indicates if the listing is a daily deal. This flag is true for active deals and false for inactive/expired deals. "
  isDailyDeal: Boolean!
  """
   Indicates this listing was part of a current or expired deal.
  This flag is a permanent flag, will be set when a deal is created for a listing and the will not be reset for the listing again.
  Will be null if the listing is not part of a deal.
  """
  isDailyDealPermanent: Boolean
  """
   Indicates there's a quantity restriction per buyer to buy
  will be null if listing is not part of a deal.
  """
  isQuantityRestrictedToBuy: Boolean
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

"${inherit}"
type SingleSkuListing implements ListingV2 @key(fields : "listingId", resolvable : true) {
  """
   Contains information if the listing is a Daily Deal or not and other details. If null, the listing is not a Deal.
  But all listings are eligible to become Deals. 
  """
  dealDetails: ListingDailyDealDetails @tag_directive(add : "inaccessible", gateway : "publicapi") @tag_directive(add : "inaccessible", gateway : "sandbox")
  "${inherit}"
  listingId: ID!
}

