schema @composeDirective(name : "@exclude") @link(import : ["@key", "@requires", "@shareable", "@external", "@composeDirective"], url : "https://specs.apollo.dev/federation/v2.3") @link(import : ["@exclude"], url : "https://ulppecs.dev/directives/v1.0"){
  query: Query
}

directive @composeDirective(name: String!) repeatable on SCHEMA

directive @exclude(gateways: [String!]!) repeatable on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @external on OBJECT | FIELD_DEFINITION

directive @federation__extends on OBJECT | INTERFACE

directive @federation__interfaceObject on OBJECT

directive @federation__override(from: String!) on FIELD_DEFINITION

directive @federation__provides(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @inaccessible on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

directive @key(fields: federation__FieldSet!, resolvable: Boolean = true) repeatable on OBJECT | INTERFACE

directive @link(as: String, for: link__Purpose, import: [link__Import], url: String!) repeatable on SCHEMA

directive @requires(fields: federation__FieldSet!) on FIELD_DEFINITION

directive @shareable repeatable on OBJECT | FIELD_DEFINITION

directive @tag(name: String!) repeatable on SCHEMA | SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | INTERFACE | UNION | ENUM | ENUM_VALUE | INPUT_OBJECT | INPUT_FIELD_DEFINITION

union _Entity = FulfillmentTerms | ShippingProgramEligibility

" ${inherit} "
type Amount @shareable {
  " ${inherit} "
  currency: CurrencyAlpha3Code
  " ${inherit} "
  value: Decimal!
}

" ${inherit} "
type FulfillmentTerms @key(fields : "listingId", resolvable : true) @shareable {
  " ${inherit} "
  listingId: ID!
  "This type serves as an entity for various shipping programs eligibility. Different shipping programs return distinct entity structures."
  shippingProgramEligibility: ShippingProgramEligibility @exclude(gateways : ["publicapi"])
}

"""
Consolidated Global Shipping Program (GSP) eligibility data used for cross-border fulfillment.
This type captures data obtained from partner-provided estimates and seller-supplied information that determined eligibility of the item.
Note: The GSP program is planned to be sunset by the end of 2026.
"""
type GlobalShippingProgramEligibility @exclude(gateways : ["publicapi"]) {
  """
  Source of the item dimensions used to determine eligibility. Indicates whether dimensions were provided by the seller or estimated by the partner.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: "SELLER_PROVIDED_SCALE"
  """
  dimensionSource: String
  """
  Domestic leg shipping cost to ship the item from seller to the partner's warehouse.
  The Amount currency will always be GBP as this program is UK-specific.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  """
  domesticLegCost: Amount
  """
  This identifier specifies UK domestic shipping service codes that needs to be used for combined eBay managed Shipping use cases.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: "UK_INTERNAL_ROYAL"
  """
  domesticShippingServiceId: String
  "Indicates whether an item is eligible for Global Shipping Program."
  eligible: Boolean!
  """
  Estimated Weight of the item in grams that was used to determine eligibility.
  This value represents the actual weight considered during eligibility calculation.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: 1480.0
  """
  estimatedWeight: Float
  """
  Source who provided the estimatedWeight used to determine eligibility.
  Indicates whether the weight came from the seller's input or was estimated by the partner.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: "SELLER_PROVIDED"
  """
  estimatedWeightSource: String
  """
  Harmonized System code (6-10 digits) used to determine eligibility.
  This international tariff classification code was either predicted by the partner based on listing data or provided by the seller.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: "490199"
  """
  harmonizedSystemCode: String
  """
  Source of the hsCode - indicates who provided the Harmonized System code that was used to determine eligibility. Either provided by the seller or predicted by the partner.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: "SELLER_PROVIDED"
  """
  harmonizedSystemCodeSource: String
  """
  Version number of the partner's attribute estimation model.
  This identifies which version of the model was used to estimate item attributes for eligibility determination.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: 5
  """
  itemAttributeEstimatorVersion: Int
  """
  Data version of the model used by the partner to determine eligibility.
  This is an integer version number that tracks which dataset version the partner's models were trained on.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: 5314
  """
  itemEstimatorDataVersion: Int
  """
  Partner-specific tracking metadata.
  Contains model version information used during eligibility determination:
  "hmv": HS code model version used for classification.
  "wmv": Weight model version used for estimation.
  "ddbf": Data Determination Bit Field from partner.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  Example: {"hmv":5,"wmv":17,"ddbf":"000000"}
  """
  itemEstimatorModelMode: String
  """
  Postal code of the third-party partner's hub address.
  This can be null when eligibility is false.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  """
  partnerHubPostalCode: String
  """
  List of countries where the item cannot be shipped due to restrictions.
  Contains country codes identified by the partner where the item cannot be shipped based on item details, eBay restrictions, and/or partner restrictions.
  This can be null when eligibility is false or when the partner service does not return a value during evaluation.
  Clients should treat null field values as unavailable data and handle accordingly based on their use case.
  """
  partnerRestrictedCountries: [CountryAlpha2Code!]
}

type Query {
  _entities(representations: [_Any!]!): [_Entity]!
  _service: _Service!
}

"This type serves as an entity for various shipping programs eligibility. Different shipping programs return distinct entity structures."
type ShippingProgramEligibility @exclude(gateways : ["publicapi"]) @key(fields : "listingId", resolvable : true) {
  """
  Consolidated Global Shipping Program (GSP) eligibility data used for cross-border fulfillment.
  This type captures data obtained from partner-provided estimates and seller-supplied information that determined eligibility of the item.
  Note: The GSP program is planned to be sunset by the end of 2026.
  Global Shipping Program is only available in the UK market. This object is null for non-UK listings.
  When null, clients should infer that the listing is not eligible for the Global Shipping Program.
  """
  globalShippingProgram: GlobalShippingProgramEligibility @exclude(gateways : ["publicapi"])
  "The unique identifier for the listing."
  listingId: ID!
}

type _Service {
  sdl: String!
}

