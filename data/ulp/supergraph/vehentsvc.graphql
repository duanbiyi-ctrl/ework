  "ID of the listing"
  listingId: ID!
  """
  If this is a vehicle listing, then this field has vehicle related details.
  If this is not a vehicle listing, then this field is null.
  This field will return the vehicle listing details if listing Id is provided
  Maybe null if the listing is not a vehicle listing
  This field cannot be used to identify if the listing is a vehicle listing
  """
  vehicleListingDetails: VehicleListingDetails @compress @exclude(gateways : ["publicapi"])
}

