site_name: Item Domain LDM Documentation
site_description: Comprehensive guide to Item Domain Logical Data Model in GDS
site_url: https://yeqli.github.io/gds-item-docs/

repo_url: https://github.com/GDS/gds-item-docs
repo_name: gds-item-docs

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - table-reader

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Core Concepts: concepts/core-concepts.md
  - LDM Catalog:
      - Govern:
          - Item: entities/item.md
          - Variation: entities/variation.md
      - Raw:
          - Item LDMs:
              - ItemRoot LDM: entities/itemkeyspace-root.md
              - ItemCompatibility LDM: entities/itemkeyspace-item-compatibility.md
              - ItemDescription LDM: entities/itemkeyspace-item-description.md
              - ItemPriceAndQuantity LDM: entities/itemkeyspace-item-qty-price.md
              - ItemDetails LDM: entities/itemkeyspace-item-details.md
              - ItemBusinessPolicies LDM: entities/itemkeyspace-business-policies.md
              - ItemUUIDMapping LDM: entities/itemkeyspace-uuid-map.md
              - ItemLock LDM: entities/itemkeyspace-item-lock.md
          - Item Group LDMs:
              - ItemGroupRoot LDM: entities/itemgroupkeyspace-root.md
              - ItemGroupDescription LDM: entities/itemgroupkeyspace-group-description.md
              - ItemGroupBusinessPolicies LDM: entities/itemgroupkeyspace-group-business-policies.md
          - Listing Draft LDMs:
              - ListingDraftRoot LDM: entities/listingdraft-root.md
              - ListingDraftItem LDM: entities/listingdraft-item-draft.md
              - ListingDraftItemCompatibility LDM: entities/listingdraft-item-draft-compatibility.md
              - ListingDraftGroup LDM: entities/listingdraft-item-group-draft.md
              - ListingDraftGroupCompatibility LDM: entities/listingdraft-item-group-draft-compatibility.md
              - ListingDraftGroupDescription LDM: entities/listingdraft-item-group-draft-desc.md
          - User Listing Draft LDM:
              - UserListingDraftMap LDM: entities/userlistingdraft-user-item-draft-map.md
          - Listing Revision LDMs:
              - ListingRevisionRoot LDM: entities/listingrevisionkeyspace-root.md
              - ListingRevision LDM: entities/listingrevisionkeyspace-listing-revision.md
              - ListingRevisionDetail LDM: entities/listingrevisionkeyspace-listing-revision-detail.md
              - ListingVariationRevisionDetail LDM: entities/listingrevisionkeyspace-variation-revision-detail.md
      - Relationship:
          - Item Common Attribute Value Mapping: relationships/item_common_attribute_value_mapping.md
      - Business Process:
          - Item: entities/item-business-process.md
  - Guides:
      - Migration Guide: guides/migration-guide.md
      - Query Examples: guides/query-examples.md
  - Reference:
      - LDM Design Principle: reference/ldm-modeling-principle.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yeqli/gds-item-docs
