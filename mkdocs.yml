site_name: Item Domain LDM Documentation
site_description: Comprehensive guide to Item Domain Logical Data Model in GDS
site_url: https://yeqli.github.io/gds-item-docs/

repo_url: https://github.com/GDS/gds-item-docs
repo_name: gds-item-docs

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - table-reader

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Core Concepts: concepts/core-concepts.md
  - LDM Catalog:
      - Entity:
          - Item: entities/item.md
          - Site: entities/site.md
          - Category: entities/category.md
          - Country: entities/country.md
          - MSKU: entities/msku.md
          - SSKU: entities/ssku.md
          - Variation: entities/variation.md
          - Product: entities/product.md
      - Relationship:
          - Item Common Attribute Value Mapping: relationships/item_common_attribute_value_mapping.md
  - Guides:
      - Migration Guide: guides/migration-guide.md
      - Query Examples: guides/query-examples.md
  - Reference:
      - LDM Design Principle: reference/ldm-modeling-principle.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yeqli/gds-item-docs
