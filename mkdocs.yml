site_name: Item Domain LDM Documentation
site_description: Comprehensive guide to Item Domain Logical Data Model in GDS
site_url: https://duanbiyi-ctrl.github.io/ework/

repo_url: https://github.com/duanbiyi-ctrl/ework
repo_name: duanbiyi-ctrl/ework

theme:
  name: material
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - table-reader

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - Overview: index.md
  - Core Concepts: concepts/core-concepts.md
  - LDM Catalog:
      - Govern:
          - Item: entities/item.md
          - Variation: entities/variation.md
      - Raw:
          - ItemRoot: entities/itemkeyspace-root.md
          - ItemCompatibility: entities/itemkeyspace-item-compatibility.md
          - ItemDescription: entities/itemkeyspace-item-description.md
          - ItemPriceAndQuantity: entities/itemkeyspace-item-qty-price.md
          - ItemDetails: entities/itemkeyspace-item-details.md
          - ItemBusinessPolicies: entities/itemkeyspace-business-policies.md
          - ItemUUIDMapping: entities/itemkeyspace-uuid-map.md
          - ItemLock: entities/itemkeyspace-item-lock.md
          - ItemGroupRoot: entities/itemgroupkeyspace-root.md
          - ItemGroupDescription: entities/itemgroupkeyspace-group-description.md
          - ItemGroupBusinessPolicies: entities/itemgroupkeyspace-group-business-policies.md
          - ListingDraftRoot: entities/listingdraft-root.md
          - ListingDraftItem: entities/listingdraft-item-draft.md
          - ListingDraftItemCompatibility: entities/listingdraft-item-draft-compatibility.md
          - ListingDraftGroup: entities/listingdraft-item-group-draft.md
          - ListingDraftGroupCompatibility: entities/listingdraft-item-group-draft-compatibility.md
          - ListingDraftGroupDescription: entities/listingdraft-item-group-draft-desc.md
          - UserListingDraftMap: entities/userlistingdraft-user-item-draft-map.md
          - ListingRevisionRoot: entities/listingrevisionkeyspace-root.md
          - ListingRevision: entities/listingrevisionkeyspace-listing-revision.md
          - ListingRevisionDetail: entities/listingrevisionkeyspace-listing-revision-detail.md
          - ListingVariationRevisionDetail: entities/listingrevisionkeyspace-variation-revision-detail.md
      - Relationship:
          - Item Common Attribute Value Mapping: relationships/item_common_attribute_value_mapping.md
      - Business Process:
          - Item: entities/item-business-process.md
  - Guides:
      - Migration Guide: guides/migration-guide.md
      - Query Examples: guides/query-examples.md
  - Reference:
      - LDM Design Principle: reference/ldm-modeling-principle.md
      - LDM Review Notes: reference/ldm-review-notes.md
      - Sample Data vs. Schema Alignment: reference/sample-data-schema-alignment.md
      - ULP vs DW:
          - Field Comparison (DW vs ULP): reference/ulp/dw-vs-ulp-field-comparison.md
          - Architecture Analysis (Why They Differ): reference/ulp/ulp-vs-dw-architecture-analysis.md
  - FAQ: faq.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/duanbiyi-ctrl/ework
